<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>俄罗斯方块小游戏</title>
	<style>
		:root {
			--bg-1: #0b1020;
			--bg-2: #121a33;
			--panel: rgba(10, 16, 32, 0.78);
			--panel-border: rgba(255, 255, 255, 0.10);
			--text: #eef2ff;
			--muted: #a8b3d9;
			--accent: #7dd3fc;
			--accent-2: #f59e0b;
			--danger: #fb7185;
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			min-height: 100%;
		}

		body {
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			color: var(--text);
			background:
				radial-gradient(circle at top, rgba(125, 211, 252, 0.20), transparent 34%),
				radial-gradient(circle at bottom right, rgba(245, 158, 11, 0.18), transparent 28%),
				linear-gradient(160deg, var(--bg-1), var(--bg-2));
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 24px;
			overflow: hidden;
		}

		.app {
			width: min(1280px, 100%);
			min-height: calc(100vh - 36px);
			display: grid;
			grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.85fr);
			gap: 16px;
			align-items: stretch;
		}

		.stage {
			background: var(--panel);
			border: 1px solid var(--panel-border);
			border-radius: 24px;
			padding: 18px;
			box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
			backdrop-filter: blur(12px);
		}

		.header {
			display: flex;
			justify-content: space-between;
			align-items: end;
			gap: 16px;
			margin-bottom: 12px;
			flex-wrap: wrap;
		}

		h1 {
			margin: 0;
			font-size: clamp(28px, 4vw, 44px);
			letter-spacing: 0.04em;
		}

		.subtitle {
			margin: 6px 0 0;
			color: var(--muted);
			font-size: 14px;
		}

		.status {
			padding: 10px 14px;
			border-radius: 999px;
			background: rgba(125, 211, 252, 0.12);
			color: var(--accent);
			border: 1px solid rgba(125, 211, 252, 0.25);
			font-size: 14px;
			white-space: nowrap;
		}

		.board-wrap {
			display: grid;
			place-items: center;
			min-height: 0;
			height: calc(100vh - 150px);
			background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
			border-radius: 20px;
			border: 1px solid rgba(255,255,255,0.06);
			padding: 12px;
			position: relative;
			overflow: hidden;
		}

		canvas {
			display: block;
			image-rendering: pixelated;
		}

		#board {
			width: min(100%, calc((100vh - 220px) / 2 * 0.5));
			max-width: 420px;
			aspect-ratio: 10 / 20;
			border-radius: 16px;
			background: rgba(2, 6, 23, 0.78);
			box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
		}

		.sidebar {
			display: grid;
			gap: 12px;
			align-content: start;
			min-height: 0;
			max-height: calc(100vh - 48px);
			overflow-y: auto;
			padding-right: 4px;
		}

		.card {
			background: var(--panel);
			border: 1px solid var(--panel-border);
			border-radius: 20px;
			padding: 14px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
			backdrop-filter: blur(12px);
		}

		.card h2 {
			margin: 0 0 10px;
			font-size: 18px;
			letter-spacing: 0.03em;
		}

		.stats {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 10px;
		}

		.stat {
			padding: 12px;
			border-radius: 16px;
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.06);
		}

		.stat-label {
			display: block;
			font-size: 12px;
			color: var(--muted);
			margin-bottom: 6px;
			text-transform: uppercase;
			letter-spacing: 0.12em;
		}

		.stat-value {
			font-size: 28px;
			font-weight: 700;
		}

		#next {
			width: 100%;
			max-width: 160px;
			aspect-ratio: 1 / 1;
			display: block;
			margin: 0 auto;
			border-radius: 16px;
			background: rgba(2, 6, 23, 0.78);
			box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
		}

		.controls {
			display: grid;
			gap: 8px;
		}

		.control-row {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 8px;
		}

		.btn {
			border: 0;
			border-radius: 14px;
			padding: 11px 14px;
			font: inherit;
			font-weight: 700;
			color: #06111f;
			background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
			cursor: pointer;
			transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
			box-shadow: 0 12px 26px rgba(0, 0, 0, 0.18);
		}

		.btn:hover {
			transform: translateY(-1px);
		}

		.btn:active {
			transform: translateY(1px) scale(0.99);
		}

		.btn.primary {
			background: linear-gradient(135deg, #38bdf8, #22c55e);
		}

		.btn.warn {
			background: linear-gradient(135deg, #fb7185, #f59e0b);
		}

		.btn.ghost {
			background: rgba(255, 255, 255, 0.08);
			color: var(--text);
			border: 1px solid rgba(255, 255, 255, 0.08);
			box-shadow: none;
		}

		.help {
			color: var(--muted);
			font-size: 12px;
			line-height: 1.7;
		}

		.help kbd {
			display: inline-block;
			min-width: 1.9em;
			padding: 0.12em 0.45em;
			border-radius: 8px;
			border: 1px solid rgba(255,255,255,0.16);
			background: rgba(255,255,255,0.08);
			color: var(--text);
			text-align: center;
			font-size: 12px;
		}

		.mobile-pad {
			display: grid;
			gap: 8px;
		}

		.dpad {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 8px;
		}

		.dpad .btn {
			padding: 12px 10px;
		}

		.span-3 {
			grid-column: span 3;
		}

		.overlay {
			position: absolute;
			inset: 14px;
			display: none;
			align-items: center;
			justify-content: center;
			border-radius: 16px;
			background: rgba(2, 6, 23, 0.82);
			text-align: center;
			padding: 18px;
		}

		.overlay.show {
			display: flex;
		}

		.overlay h2 {
			margin: 0 0 8px;
			font-size: 34px;
		}

		.overlay p {
			margin: 0;
			color: var(--muted);
		}

		@media (max-width: 920px) {
			.app {
				grid-template-columns: 1fr;
				min-height: auto;
			}

			.board-wrap {
				height: auto;
				min-height: 0;
			}

			.sidebar {
				max-height: none;
				overflow: visible;
				padding-right: 0;
			}
		}

		@media (max-height: 900px) {
			body {
				align-items: flex-start;
				padding: 12px;
			}

			.app {
				min-height: auto;
				gap: 12px;
			}

			.board-wrap {
				height: calc(100vh - 150px);
			}

			#board {
				width: min(100%, 260px);
			}

			.stage,
			.card {
				padding: 12px;
			}

			.sidebar {
				gap: 10px;
			}

			.controls,
			.sidebar .card:last-child {
				display: none;
			}
		}

		@media (max-width: 560px) {
			body {
				padding: 12px;
			}

			.stage, .card {
				padding: 14px;
				border-radius: 16px;
			}

			.stats {
				grid-template-columns: 1fr 1fr;
			}
		}
	</style>
</head>
<body>
	<main class="app">
		<section class="stage">
			<div class="header">
				<div>
					<h1>俄罗斯方块</h1>
					<p class="subtitle">方向键控制，空格硬降，P 暂停，R 重开。</p>
				</div>
				<div id="status" class="status">准备开始</div>
			</div>

			<div class="board-wrap">
				<canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas>
				<div id="overlay" class="overlay">
					<div>
						<h2 id="overlayTitle">游戏结束</h2>
						<p id="overlayText">按 R 重新开始</p>
					</div>
				</div>
			</div>
		</section>

		<aside class="sidebar">
			<section class="card">
				<h2>信息面板</h2>
				<div class="stats">
					<div class="stat">
						<span class="stat-label">分数</span>
						<div id="score" class="stat-value">0</div>
					</div>
					<div class="stat">
						<span class="stat-label">等级</span>
						<div id="level" class="stat-value">1</div>
					</div>
					<div class="stat">
						<span class="stat-label">消除</span>
						<div id="lines" class="stat-value">0</div>
					</div>
					<div class="stat">
						<span class="stat-label">状态</span>
						<div id="state" class="stat-value" style="font-size: 18px;">进行中</div>
					</div>
				</div>
			</section>

			<section class="card">
				<h2>下一块</h2>
				<canvas id="next" width="180" height="180" aria-label="Next piece preview"></canvas>
			</section>

			<section class="card controls">
				<h2>操作</h2>
				<div class="control-row">
					<button class="btn primary" id="restartBtn">重新开始</button>
					<button class="btn ghost" id="pauseBtn">暂停 / 继续</button>
				</div>
				<div class="mobile-pad">
					<div class="dpad">
						<button class="btn ghost" id="leftBtn">左</button>
						<button class="btn ghost" id="rotateBtn">旋转</button>
						<button class="btn ghost" id="rightBtn">右</button>
						<button class="btn ghost span-3" id="downBtn">下移</button>
						<button class="btn warn span-3" id="dropBtn">快速下落</button>
					</div>
				</div>
			</section>

			<section class="card">
				<h2>键盘说明</h2>
				<div class="help">
					<div><kbd>←</kbd> <kbd>→</kbd> 移动</div>
					<div><kbd>↑</kbd> 旋转</div>
					<div><kbd>↓</kbd> 加速下落</div>
					<div><kbd>Space</kbd> 硬降</div>
					<div><kbd>P</kbd> 暂停</div>
					<div><kbd>R</kbd> 重开</div>
				</div>
			</section>
		</aside>
	</main>

	<script>
		const boardCanvas = document.getElementById('board');
		const boardCtx = boardCanvas.getContext('2d');
		const nextCanvas = document.getElementById('next');
		const nextCtx = nextCanvas.getContext('2d');

		const scoreEl = document.getElementById('score');
		const levelEl = document.getElementById('level');
		const linesEl = document.getElementById('lines');
		const stateEl = document.getElementById('state');
		const statusEl = document.getElementById('status');
		const overlayEl = document.getElementById('overlay');
		const overlayTitleEl = document.getElementById('overlayTitle');
		const overlayTextEl = document.getElementById('overlayText');

		const ROWS = 20;
		const COLS = 10;
		const BLOCK = 30;
		const COLORS = {
			I: '#67e8f9',
			O: '#facc15',
			T: '#c084fc',
			S: '#4ade80',
			Z: '#fb7185',
			J: '#60a5fa',
			L: '#fb923c'
		};

		const SHAPES = [
			{ type: 'I', matrix: [[1, 1, 1, 1]] },
			{ type: 'O', matrix: [[1, 1], [1, 1]] },
			{ type: 'T', matrix: [[0, 1, 0], [1, 1, 1]] },
			{ type: 'S', matrix: [[0, 1, 1], [1, 1, 0]] },
			{ type: 'Z', matrix: [[1, 1, 0], [0, 1, 1]] },
			{ type: 'J', matrix: [[1, 0, 0], [1, 1, 1]] },
			{ type: 'L', matrix: [[0, 0, 1], [1, 1, 1]] }
		];

		let board = createBoard();
		let currentPiece = null;
		let nextPiece = randomPiece();
		let score = 0;
		let lines = 0;
		let level = 1;
		let dropCounter = 0;
		let lastTime = 0;
		let dropInterval = 1000;
		let paused = false;
		let gameOver = false;

		function createBoard() {
			return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
		}

		function randomPiece() {
			const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
			return {
				type: shape.type,
				matrix: shape.matrix.map(row => row.slice()),
				x: Math.floor((COLS - shape.matrix[0].length) / 2),
				y: 0
			};
		}

		function cloneMatrix(matrix) {
			return matrix.map(row => row.slice());
		}

		function rotateMatrix(matrix) {
			const size = matrix.length;
			const width = matrix[0].length;
			const rotated = Array.from({ length: width }, () => Array(size).fill(0));

			for (let y = 0; y < size; y++) {
				for (let x = 0; x < width; x++) {
					rotated[x][size - 1 - y] = matrix[y][x];
				}
			}

			return rotated;
		}

		function drawCell(ctx, x, y, color, cellSize) {
            
			const px = x * cellSize;
			const py = y * cellSize;
            console.log(px,py);
			ctx.fillStyle = color;
			ctx.fillRect(px + 1, py + 1, cellSize - 2, cellSize - 2);
			ctx.strokeStyle = 'rgba(255,255,255,0.18)';
			ctx.strokeRect(px + 1, py + 1, cellSize - 2, cellSize - 2);
		}

		function drawGrid(ctx, width, height, cellSize) {
			ctx.strokeStyle = 'rgba(255,255,255,0.05)';
			ctx.lineWidth = 1;

			for (let x = 0; x <= width / cellSize; x++) {
				ctx.beginPath();
				ctx.moveTo(x * cellSize, 0);
				ctx.lineTo(x * cellSize, height);
				ctx.stroke();
			}

			for (let y = 0; y <= height / cellSize; y++) {
				ctx.beginPath();
				ctx.moveTo(0, y * cellSize);
				ctx.lineTo(width, y * cellSize);
				ctx.stroke();
			}
		}

		function drawBoard() {
            
			boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
			boardCtx.fillStyle = '#08111f';
			boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
			drawGrid(boardCtx, boardCanvas.width, boardCanvas.height, BLOCK);

			for (let y = 0; y < ROWS; y++) {
				for (let x = 0; x < COLS; x++) {
					if (board[y][x]) {
						drawCell(boardCtx, x, y, COLORS[board[y][x]], BLOCK);
					}
				}
			}

			if (currentPiece) {
				currentPiece.matrix.forEach((row, y) => {
					row.forEach((value, x) => {
						if (value) {
							drawCell(boardCtx, currentPiece.x + x, currentPiece.y + y, COLORS[currentPiece.type], BLOCK);
						}
					});
				});
			}
		}

		function drawNextPiece() {
			const size = 36;
			nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
			nextCtx.fillStyle = '#08111f';
			nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
			drawGrid(nextCtx, nextCanvas.width, nextCanvas.height, size);

			if (!nextPiece) {
				return;
			}

			const matrix = nextPiece.matrix;
			const offsetX = Math.floor((nextCanvas.width / size - matrix[0].length) / 2);
			const offsetY = Math.floor((nextCanvas.height / size - matrix.length) / 2);

			matrix.forEach((row, y) => {
				row.forEach((value, x) => {
					if (value) {
						drawCell(nextCtx, offsetX + x, offsetY + y, COLORS[nextPiece.type], size);
					}
				});
			});
		}

		function updateUI() {
			scoreEl.textContent = score;
			levelEl.textContent = level;
			linesEl.textContent = lines;
			stateEl.textContent = gameOver ? '结束' : paused ? '暂停' : '进行中';
			statusEl.textContent = gameOver ? '游戏结束' : paused ? '已暂停' : '准备就绪';

			overlayEl.classList.toggle('show', gameOver || paused);
			if (gameOver) {
				overlayTitleEl.textContent = '游戏结束';
				overlayTextEl.textContent = '按 R 重新开始';
			} else if (paused) {
				overlayTitleEl.textContent = '暂停中';
				overlayTextEl.textContent = '按 P 继续游戏';
			}
		}

		function collide(piece, offsetX = 0, offsetY = 0, matrix = piece.matrix) {
			for (let y = 0; y < matrix.length; y++) {
				for (let x = 0; x < matrix[y].length; x++) {
					if (!matrix[y][x]) {
						continue;
					}

					const boardX = piece.x + x + offsetX;
					const boardY = piece.y + y + offsetY;

					if (boardX < 0 || boardX >= COLS || boardY >= ROWS) {
						return true;
					}

					if (boardY >= 0 && board[boardY][boardX]) {
						return true;
					}
				}
			}

			return false;
		}

		function mergePiece() {
			currentPiece.matrix.forEach((row, y) => {
				row.forEach((value, x) => {
					if (value && currentPiece.y + y >= 0) {
						board[currentPiece.y + y][currentPiece.x + x] = currentPiece.type;
					}
				});
			});
		}

		function clearLines() {
			let cleared = 0;

			for (let y = ROWS - 1; y >= 0; y--) {
				if (board[y].every(Boolean)) {
					board.splice(y, 1);
					board.unshift(Array(COLS).fill(null));
					cleared++;
					y++;
				}
			}

			if (cleared > 0) {
				lines += cleared;
				const lineScores = [0, 100, 300, 500, 800];
				score += lineScores[cleared] * level;
				level = Math.floor(lines / 10) + 1;
				dropInterval = Math.max(120, 1000 - (level - 1) * 80);
			}
		}

		function spawnPiece() {
			currentPiece = nextPiece;
			currentPiece.x = Math.floor((COLS - currentPiece.matrix[0].length) / 2);
			currentPiece.y = 0;
			nextPiece = randomPiece();
			drawNextPiece();

			if (collide(currentPiece)) {
				gameOver = true;
				paused = false;
				updateUI();
			}
		}

		function resetGame() {
			board = createBoard();
			currentPiece = null;
			nextPiece = randomPiece();
			score = 0;
			lines = 0;
			level = 1;
			dropCounter = 0;
			lastTime = 0;
			dropInterval = 1000;
			paused = false;
			gameOver = false;
			spawnPiece();
			drawBoard();
			drawNextPiece();
			updateUI();
		}

		function dropPiece() {
			if (!currentPiece || paused || gameOver) {
				return;
			}

			currentPiece.y++;

			if (collide(currentPiece)) {
				currentPiece.y--;
				mergePiece();
				clearLines();
				spawnPiece();
				score += 10;
			}

			drawBoard();
			updateUI();
		}

		function hardDrop() {
			if (!currentPiece || paused || gameOver) {
				return;
			}

			let distance = 0;

			while (!collide(currentPiece, 0, 1)) {
				currentPiece.y++;
				distance++;
			}

			score += distance * 2;
			mergePiece();
			clearLines();
			spawnPiece();
			drawBoard();
			updateUI();
		}

		function movePiece(direction) {
			if (!currentPiece || paused || gameOver) {
				return;
			}

			currentPiece.x += direction;
			if (collide(currentPiece)) {
				currentPiece.x -= direction;
			}

			drawBoard();
		}

		function rotatePiece() {
			if (!currentPiece || paused || gameOver) {
				return;
			}

			const originalMatrix = cloneMatrix(currentPiece.matrix);
			const originalX = currentPiece.x;
			const rotated = rotateMatrix(currentPiece.matrix);
			currentPiece.matrix = rotated;

			let shift = 0;
			while (collide(currentPiece)) {
				currentPiece.x += shift > 0 ? -1 : 1;
				shift = -(shift + (shift > 0 ? 1 : -1));

				if (Math.abs(shift) > currentPiece.matrix[0].length + 1) {
					currentPiece.matrix = originalMatrix;
					currentPiece.x = originalX;
					break;
				}
			}

			drawBoard();
		}

		function togglePause() {
			if (gameOver) {
				return;
			}

			paused = !paused;
			updateUI();
		}

		function update(time = 0) {
			const delta = time - lastTime;
			lastTime = time;

			if (!paused && !gameOver) {
				dropCounter += delta;
				if (dropCounter >= dropInterval) {
					dropPiece();
					dropCounter = 0;
				}
			}

			drawBoard();
			requestAnimationFrame(update);
		}

		document.addEventListener('keydown', event => {
			const key = event.key.toLowerCase();

			if (key === 'p') {
				togglePause();
				return;
			}

			if (key === 'r') {
				resetGame();
				return;
			}

			if (paused || gameOver) {
				return;
			}

			if (event.key === 'ArrowLeft') {
				event.preventDefault();
				movePiece(-1);
			} else if (event.key === 'ArrowRight') {
				event.preventDefault();
				movePiece(1);
			} else if (event.key === 'ArrowDown') {
				event.preventDefault();
				dropPiece();
			} else if (event.key === 'ArrowUp') {
				event.preventDefault();
				rotatePiece();
			} else if (event.code === 'Space') {
				event.preventDefault();
				hardDrop();
			}
		});

		document.getElementById('restartBtn').addEventListener('click', resetGame);
		document.getElementById('pauseBtn').addEventListener('click', togglePause);
		document.getElementById('leftBtn').addEventListener('click', () => movePiece(-1));
		document.getElementById('rightBtn').addEventListener('click', () => movePiece(1));
		document.getElementById('rotateBtn').addEventListener('click', rotatePiece);
		document.getElementById('downBtn').addEventListener('click', dropPiece);
		document.getElementById('dropBtn').addEventListener('click', hardDrop);

		resetGame();
		update();
	</script>
</body>
</html>
