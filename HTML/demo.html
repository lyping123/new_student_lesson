<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        h1{
            color: blue;
            background-color: lightgray;
            padding:20px;
            margin: auto;
            width:200px;
            box-shadow: 10px 10px 10px gray;
        }

    </style>
    
    <h1>Fish market</h1>
    <p>Welcome to the fish market</p>

    <input type="text" placeholder="Enter fish name" />
    <button type="button">Search</button>

    <a href="https://www.google.com" >Google</a>

    <img src="./picture/fish.jpg" alt="fish image" width="100" height="100" />

    <table>
        <thead>
            <th>Fish Name</th>
            <th>Price</th>
            <th>Quantity</th>
        </thead>
        <tbody>
            <tr>
                <td>Salmon</td>
                <td>$10</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Tuna</td>
                <td>$15</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Trout</td>
                <td>$8</td>
                <td>25</td>
            </tr>
             <tr>
                <td>Cod</td>
                <td>$12</td>
                <td>15</td>
            </tr>
    </table>

</body>
</html>
