<!DOCTYPE html>
<html>
<head>
<title>Happy Teachers Day</title>
<style>
    body {
        font-family: 'Arial', sans-serif;
        text-align: center;
        background-color: #f0f8ff;
        padding: 50px;
    }
    .card {
        background-color: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        display: inline-block;
    }
    h1 {
        color: #2c3e50;
    }
    p {
        color: #555;
        font-size: 1.2em;
    }
</style>
</head>
<body>

<div class="card">
    <h1>Happy Teacher's Day!</h1>
    <p>Dear Teacher, thank you for inspiring hope,</p>
    <p>igniting imagination, and instilling a love of learning.</p>
    <p><strong>- With Gratitude</strong></p>
</div>

</body>
</html>
