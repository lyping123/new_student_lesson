<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Country Popularity</h1>
    <p>This is a simple page to display country popularity data.</p>
    <div id="country-data">
        
    </div>

    <script>
        function loadCountryData(){
            fetch('https://countriesnow.space/api/v0.1/countries/population/cities')
            .then(response => response.json())
            .then(data => {
                const countryData=data.data;
                const countryDiv=document.getElementById("country-data");
                countryData.forEach(country=>{
                    //const population=country.populationCounts.reduce((acc, curr) => acc + parseInt(curr.value), 0);
                    const population=country.populationCounts;
                    let populationValue=0;
                    let year="";
                    if(country.country=="Malaysia"){
                        population.forEach(pop=>{
                                populationValue=pop.value;
                                year=pop.year;
                        });
                        
                        const para=document.createElement("p");
                        para.innerHTML=`Country: ${country.country}, City: ${country.city}, Population: ${populationValue}, Year: ${year}`;
                        countryDiv.appendChild(para);
                    }
                    
                    
                });
            });
        
        }
        loadCountryData();
    </script>
</body>
</html>
